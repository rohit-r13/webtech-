<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Company Navigation Bar</title>

<style>

/* Navigation bar style */
nav{
    background-color:#333;
    width:100%;
    padding:10px;
}

/* Link styling */
nav a{
    display:inline-block;
    color:white;
    text-decoration:none;
    padding:10px 20px;
    margin:5px;
    font-size:18px;
}

/* Hover effect */
nav a:hover{
    background-color:#ff9800;
    color:black;
}

</style>

</head>

<body>

<!-- Navigation Bar -->
<nav>

<a href="#">Home</a>
<a href="#">About</a>
<a href="#">Services</a>
<a href="#">Gallery</a>
<a href="#">Contact</a>

</nav>

<h1>Welcome to Our Company Website</h1>
<p>This is the homepage content.</p>

</body>
</html>
