<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Card</title>

<style>

/* Page style */
body{
    font-family: Arial, sans-serif;
    background-color:#f2f2f2;
    text-align:center;
    padding-top:50px;
}

/* Card container */
.card{
    position:relative;
    width:250px;
    margin:auto;
    padding:20px;
    border:1px solid #ccc;
    background-color:white;
    border-radius:10px;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
}

/* Profile image */
.card img{
    width:100px;
    height:100px;
    border-radius:50%;
}

/* Badge */
.badge{
    position:absolute;
    top:10px;
    right:10px;
    background-color:green;
    color:white;
    padding:5px 10px;
    border-radius:5px;
    font-size:12px;
}

</style>
</head>

<body>

<div class="card">

<div class="badge">Online</div>

<img src="https://via.placeholder.com/100" alt="Profile Photo">

<h3>Rohit Roy</h3>

<p>
Computer Science student passionate about web development,
AI, and building innovative tech projects.
</p>

</div>

</body>
</html>
