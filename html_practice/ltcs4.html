<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Display</title>

<style>

/* Page style */
body{
    font-family: Arial, sans-serif;
    text-align:center;
}

/* Product box */
.product{
    display:inline-block;
    width:250px;
    border:2px solid #ccc;
    background-color:#f9f9f9;
    padding:15px;
    margin:20px;
    text-align:center;
}

/* Image */
.product img{
    width:150px;
    height:120px;
}

/* Buy link */
.product a{
    text-decoration:none;
    color:white;
    background-color:#007BFF;
    padding:8px 15px;
    display:inline-block;
    margin-top:10px;
}

/* Hover outline effect */
.product:hover{
    outline:3px solid #ff9800;
    outline-offset:5px;
}

</style>

</head>

<body>

<h1>Our Products</h1>

<!-- Laptop -->
<div class="product">
<img src="https://via.placeholder.com/150?text=Laptop" alt="Laptop">
<h3>Laptop</h3>
<p>Powerful laptop with fast processor and 16GB RAM.</p>
<p><strong>$899</strong></p>
<a href="#">Buy Now</a>
</div>

<!-- Headphones -->
<div class="product">
<img src="https://via.placeholder.com/150?text=Headphones" alt="Headphones">
<h3>Headphones</h3>
<p>Noise cancelling headphones with deep bass sound.</p>
<p><strong>$199</strong></p>
<a href="#">Buy Now</a>
</div>

<!-- Smartwatch -->
<div class="product">
<img src="https://via.placeholder.com/150?text=Smartwatch" alt="Smartwatch">
<h3>Smartwatch</h3>
<p>Track fitness, heart rate, and notifications easily.</p>
<p><strong>$149</strong></p>
<a href="#">Buy Now</a>
</div>

</body>
</html>
